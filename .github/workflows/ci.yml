name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate skills, agents, manifests
        run: python3 scripts/validate.py --strict
      - name: Generated adapters are in sync
        run: python3 scripts/build_adapters.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: OpenCode plugin parses
        run: node --check adapters/opencode/agent-engineer.js
